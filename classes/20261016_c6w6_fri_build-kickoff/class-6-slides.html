  <!-- Layout: grids, regions, spacing. Never edit per theme. -->
  <style>/* css/layouts.css */
/* ==========================================================================
   layouts.css: structure only.
   Grids, regions, spacing, and alignment. Every color, face, and type size
   comes from a theme custom property (see COMPONENTS.md, "Theme contract").
   scripts/lint_theme.py fails this file if it gains a hex, rgb(), named
   color, font name, or px font size.
   Units: px and rem only. Never vh or vw.
   ========================================================================== */

/* --------------------------------------------------------------------------
   Spacing tokens. One unit U = 1rem, so the theme's --type-root sets the
   unit: type and spacing scale together from one lever. At the default
   30px root, U = 30px. The layout owns the multiples, not the theme.
   The slide inset is a spacing token too (round 4): one value on all four
   sides of every slide, so the hanging rule, the side edges, and the foot
   line sit in the same place on every slide.
   -------------------------------------------------------------------------- */
:root {
  --space-1: 0.5rem;   /* 0.5U */
  --space-2: 1rem;     /* 1U   */
  --space-3: 1.5rem;   /* 1.5U */
  --space-4: 2rem;     /* 2U   */
  --space-6: 3rem;     /* 3U   */
  --space-8: 4rem;     /* 4U   */

  --gap-tight: var(--space-1);   /* label to title, heading to its text */
  --gap-group: var(--space-2);   /* heading to the block it labels */
  --gap-gutter: var(--space-3);  /* grid gutters, title block to body */
  --gap-block: var(--space-4);   /* between blocks, card padding */
  --head-to-body: var(--space-3); /* heading row to the slide body: less than the slide margin above the rule */
  /* The slide inset (round 5). Generous white space, not a crop. When content
     does not fit, the layout's maximum goes down; the inset never shrinks.
     72 matches the shared --s7 token; 60 is --space-4. Set in rem so the frame
     scales with --type-root (72, 96, and 60px at the 30px root). */
  --slide-inset-top: 2.4rem;          /* 72px: the hanging rule on content slides */
  --slide-inset-side: 3.2rem;         /* 96px: left and right */
  --slide-inset-bottom: var(--space-4); /* 60px: the foot line, y = 1020 */
  --beat-lift: var(--space-8);    /* beat slides: the block's center sits half this above the slide's middle (y = 480) */
  /* The foot row: one meta line plus a tight gap, reserved at the bottom of
     every slide body. The slide number sits in it at the right. Pinned source
     lines drop into it at the left, so both end on the foot line. */
  --foot-row: calc(var(--size-meta) * var(--leading-body) + var(--gap-tight));

  --icon-heading: 2.4rem;
  --icon-body: 1.6rem;
  --icon-inline: 1.4rem;
  --marker: 1rem;
  --row-number: 3rem;     /* number column in rows */
  --row-label: 15rem;     /* label column in rows */
  --flow-arrow: 2.4rem;
}

/* --------------------------------------------------------------------------
   Canvas and base type
   -------------------------------------------------------------------------- */
html {
  font-size: var(--type-root);
}

body,
.reveal-viewport {
  background: var(--color-ground);
}

.reveal {
  font-family: var(--font-body);
  font-weight: var(--weight-body);
  font-size: var(--size-body);
  line-height: var(--leading-body);
  color: var(--color-text);
  -webkit-font-smoothing: antialiased;
}

.reveal .slides {
  text-align: left;
}

.reveal .slides > section {
  box-sizing: border-box;
  width: 1920px;
  height: 1080px;
  padding: var(--slide-inset-top) var(--slide-inset-side) var(--slide-inset-bottom);
  flex-direction: column;
  background: var(--color-ground);
  color: var(--color-text);
}

/* Title, closing, and section opener center their block on the upper-middle
   optical line. The bottom padding is the top inset plus --beat-lift, so the
   block's center sits half a lift above the slide's middle (y = 480 of 1080
   at the default root). Every other slide, including exercises, statements,
   and single numbers, hangs its title bar from the top inset (Ken, Sept 11,
   2026: the title bar sits in the same place on every content slide and
   never moves; section dividers stay in the middle). */
.reveal .slides > section:is(.layout-title, .layout-closing, .layout-section) {
  padding-bottom: calc(var(--slide-inset-top) + var(--beat-lift));
}

.reveal .slides > section *,
.reveal .slides > section *::before,
.reveal .slides > section *::after {
  box-sizing: border-box;
}

.reveal h1,
.reveal h2,
.reveal h3 {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-style: var(--style-display);
  letter-spacing: var(--tracking-display);
  line-height: var(--leading-tight);
  color: inherit;
  margin: 0;
  text-wrap: balance;
}

.reveal h1 { font-size: var(--size-display); }
.reveal h2 { font-size: var(--size-title); max-width: 36ch; }
.reveal h3 { font-size: var(--size-heading); }

.reveal p { margin: 0; text-wrap: pretty; }

.reveal li { text-wrap: pretty; }

.reveal strong,
.reveal b {
  font-weight: var(--weight-strong);
}

/* The one accent word on a slide: <em>. */
.reveal em {
  color: var(--color-accent);
  font-style: var(--style-accent);
}

.reveal a {
  color: var(--color-structure);
  text-decoration: none;
}

/* Lucide icons. Stroke follows the type beside it. */
.reveal svg.lucide {
  flex: none;
  width: var(--icon-body);
  height: var(--icon-body);
  stroke-width: 1.5;
  color: var(--color-structure);
}

.reveal svg.lucide.icon-yes { color: var(--color-mark); }
.reveal svg.lucide.icon-no { color: var(--color-text); }

/* Icons beside a heading: heavier stroke, closer to the heading's stem */
.reveal .col-head svg.lucide,
.reveal .point-head svg.lucide {
  stroke-width: 2;
}

/* --------------------------------------------------------------------------
   Shared regions: slide head, body, lede, takeaway, source
   -------------------------------------------------------------------------- */
/* The chrome, from the document system: a full-width hanging rule, then one
   heading row with the title on the left and the label on the right, both on
   the title's first baseline. The label reads as the running section name.
   Space from the rule to the title is smaller than the slide margin above it. */
.slide-head {
  flex: none;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  column-gap: var(--gap-block);
  row-gap: var(--gap-tight);
  align-items: start;
  border-top: var(--rule-hang) solid var(--color-text);
  padding-top: var(--gap-group);
  margin-bottom: var(--head-to-body);
}

/* Cap-height top alignment, not baseline: a right-hand label on a
   one-line heading reads the same as on a two-line heading. */
.slide-head > h2 {
  grid-column: 1;
  grid-row: 1;
  text-box-trim: trim-start;
  text-box-edge: cap alphabetic;
}

.slide-head > .label {
  grid-column: 2;
  grid-row: 1;
  justify-self: end;
  text-align: right;
  text-box-trim: trim-start;
  text-box-edge: cap alphabetic;
}

.slide-head > .lede { grid-column: 1; grid-row: 2; }

.label {
  font-family: var(--font-label);
  font-weight: var(--weight-label);
  font-size: var(--size-label);
  text-transform: var(--case-label);
  letter-spacing: var(--tracking-label);
  line-height: var(--leading-tight);
  color: var(--color-text-faint);
}

.lede {
  font-size: var(--size-lead);
  line-height: var(--leading-body);
  color: var(--color-text-soft);
  max-width: 44ch;
  text-wrap: balance;
}

.slide-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--gap-block);
  padding-bottom: var(--foot-row);
}

/* Class 1 deck copy: the takeaway takes the display face and weight, so it
   reads as its own line under the body. */
.takeaway {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: var(--size-lead);
  line-height: var(--leading-body);
  color: var(--color-text);
  max-width: 52ch;
  text-wrap: balance;
}

.source {
  font-size: var(--size-meta);
  line-height: var(--leading-body);
  color: var(--color-structure);
}

/* A short description under a small heading (Ken, Sept 11, 2026): a clear
   step smaller than the heading, and a line height no taller than the
   heading's. Heading 48px on a 51.8px line; description 33px on a 46.2px
   line. Covers timeline stops, points, flow steps, cards, and columns.
   The dense flow rule below is more specific and keeps its own size. */
.slide-body :is(.stop, .point, .flow-step, .card, .col) > h3 + p,
.slide-body :is(.point, .col) > :is(.point-head, .col-head) + p {
  font-size: var(--size-code);
  line-height: var(--leading-body);
}

/* A takeaway sits a fixed --s6 gap below the content it summarizes. It is
   not pinned to the bottom. The body's flex gap is --gap-block, so the
   margin trims that gap down to --s6. The extra class beats `.reveal p`. */
.slide-body > .takeaway { margin-top: calc(var(--s6) - var(--gap-block)); }

/* A source line stays pinned to the bottom of the body, even after a takeaway */
.slide-body > .source,
.slide-body > .takeaway + .source { margin-top: auto; }

/* A pinned source line drops into the foot row, onto the foot line */
.slide-body > .source { margin-bottom: calc(var(--foot-row) * -1); }

.meta {
  font-size: var(--size-meta);
  color: var(--color-text-faint);
}

/* --------------------------------------------------------------------------
   Lists
   -------------------------------------------------------------------------- */
.list {
  display: flex;
  flex-direction: column;
  gap: var(--gap-group);
  max-width: 52ch;
  margin: 0;
  padding: 0;
  list-style: none;
}

.list > li {
  position: relative;
  padding-left: var(--gap-block);
}

ul.list > li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.475em;  /* centers the dot on the first line: 0.7em - half its height */
  width: 0.45em;
  height: 0.45em;
  border-radius: 50%;
  background: var(--color-mark);
}

ol.list { counter-reset: item; }

ol.list > li { counter-increment: item; }

ol.list > li::before {
  content: counter(item);
  position: absolute;
  left: 0;
  top: 0;
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-variant-numeric: tabular-nums;
  color: var(--color-accent);
}

/* Numbered steps: the lead phrase in bold, set in the display face */
ol.list > li > strong {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
}

/* Do and don't lines, with check and x icons */
.checks {
  display: flex;
  flex-direction: column;
  gap: var(--gap-group);
  margin: 0;
  padding: 0;
  list-style: none;
}

.checks > li {
  display: flex;
  align-items: flex-start;
  gap: var(--gap-group);
}

.checks svg.lucide {
  width: var(--icon-inline);
  height: var(--icon-inline);
  stroke-width: 2;
}

/* --------------------------------------------------------------------------
   Surfaces: card, panel, code, terminal
   -------------------------------------------------------------------------- */
.card {
  border: var(--rule-hair) solid var(--color-rule);
  border-radius: var(--radius);
  padding: var(--gap-block);
  background: var(--color-ground);
}

/* Tinted panel: the tint alone, no border. One to three sentences. */
.panel {
  border-radius: var(--radius);
  padding: var(--gap-block);
  background: var(--color-panel);
}

/* Filled callout: a solid dark block with reversed text, 20 words at most.
   The ground is the dark role, so the accent switches to its on-dark form. */
.callout {
  border-radius: var(--radius);
  padding: var(--gap-block);
  background: var(--color-dark);
  color: var(--color-on-dark);
}

.callout em { color: var(--color-accent-on-dark); }

pre.code,
pre.terminal {
  margin: 0;
  padding: var(--gap-group);
  border-radius: var(--radius);
  font-family: var(--font-mono);
  font-size: var(--size-code);
  line-height: var(--leading-body);
  white-space: pre;
  overflow: hidden;
  max-width: 100%;
}

pre.code {
  background: var(--color-code);
  border: var(--rule-hair) solid var(--color-rule);
  color: var(--color-text);
}

pre.code code,
pre.terminal code {
  font-family: inherit;
  font-size: inherit;
}

pre.code .c { color: var(--color-text-soft); }
pre.code .k { color: var(--color-structure); }
pre.code .hl { color: var(--color-accent); }

pre.terminal {
  background: var(--color-dark);
  color: var(--color-on-dark);
}

pre.terminal .prompt { color: var(--color-accent-on-dark); }
pre.terminal .out { color: var(--color-on-dark); }

/* ==========================================================================
   LAYOUTS
   ========================================================================== */

/* --------------------------------------------------------------------------
   Title and closing
   -------------------------------------------------------------------------- */
/* The course label (.label.course) is the label of the title block.
   Plain text. Course decks carry no business name, logo, or seal. */
/* Hybrid position (Ken, Sept 11, 2026): the hanging rule and the course
   label sit at the top inset, where the rule sits on content slides. The
   title, lede, and meta stay centered on the beat slides' optical line
   (y = 480). The block fills the padding box as a grid. The first and last
   rows are equal 1fr rows: the label sits at the top of the first, the last
   stays empty, so the three middle rows center on the optical line. */
.layout-title .title-block,
.layout-closing .title-block {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-rows: 1fr auto auto auto 1fr;
  grid-template-columns: minmax(0, 1fr);
  row-gap: var(--gap-group);
}

.layout-title .title-block > .label.course,
.layout-closing .title-block > .label.course {
  grid-row: 1;
  align-self: start;
  border-top: var(--rule-hang) solid var(--color-text);
  padding-top: var(--gap-group);
}

.layout-title .title-block > h1,
.layout-closing .title-block > h1 { grid-row: 2; }
.layout-title .title-block > .lede,
.layout-closing .title-block > .lede { grid-row: 3; }
.layout-title .title-block > .meta,
.layout-closing .title-block > .meta { grid-row: 4; }

.layout-title h1,
.layout-closing h1 {
  max-width: 24ch;
}

/* The label is in its own row now, so the title takes no extra top margin */
.layout-title .title-block .label + h1,
.layout-closing .title-block .label + h1 {
  margin-top: 0;
}

/* Title-to-lede gap: kept clearly bigger than the label-to-title gap
   above, so the hierarchy (label, title, lede, meta) keeps reading
   top to bottom instead of the title and lede re-crowding. */
.layout-title .title-block h1 + .lede,
.layout-closing .title-block h1 + .lede {
  margin-top: calc(var(--gap-block) - var(--gap-group));
}

.layout-title .lede,
.layout-closing .lede {
  max-width: 52ch;
}

.layout-title .meta,
.layout-closing .meta {
  margin-top: var(--gap-block);
  font-size: var(--size-label);
}

/* --------------------------------------------------------------------------
   Section opener: full-bleed band
   -------------------------------------------------------------------------- */
/* Same chrome as the slide head, reversed: a full-width rule in the band
   text color, then the title with the label on its baseline at the right.
   The slide wraps as a row so the markup stays label, h1, lede. The block
   is centered on the optical line (Ken, Sept 11, 2026: dividers belong in
   the middle, unlike the title bar on content slides). */
.reveal .slides > section.layout-section {
  flex-flow: row wrap;
  align-content: center;
  align-items: start;
  column-gap: var(--gap-block);
  background: var(--color-band);
  color: var(--color-on-band);
}

.reveal .slides > section.layout-section::before {
  content: "";
  flex: 0 0 100%;
  height: var(--rule-hang);
  margin-bottom: var(--gap-group);
  background: var(--color-on-band);
}

.layout-section .label,
.layout-section .lede {
  color: var(--color-on-band);
}

/* Cap-height top alignment, not baseline: the label sits at the top of
   the heading's first line whether the heading wraps or not. */
.layout-section h1 {
  order: 1;
  flex: 1 1 0;
  min-width: 0;
  max-width: 24ch;
  text-box-trim: trim-start;
  text-box-edge: cap alphabetic;
}

.layout-section .label {
  order: 2;
  margin-left: auto;
  text-align: right;
  text-box-trim: trim-start;
  text-box-edge: cap alphabetic;
}

/* A full-width break after the heading row, so the lede starts a new line
   even though its measure is narrower than the slide */
.reveal .slides > section.layout-section::after {
  content: "";
  order: 3;
  flex: 0 0 100%;
  height: 0;
}

.layout-section .lede {
  order: 4;
  margin-top: var(--gap-block);
}

/* --------------------------------------------------------------------------
   Exercise and timer: full-bleed dark ground
   -------------------------------------------------------------------------- */
.reveal .slides > section.layout-exercise {
  background: var(--color-dark);
  color: var(--color-on-dark);
}

.layout-exercise .label { color: var(--color-on-dark-soft); }

/* The exercise block is the deck's ink band: it hangs from the top inset
   under a full-width rule in the on-dark color, like the slide head. The
   heading row is the title on the left and the label on the right, both on
   cap-height tops. The timer and the steps sit below it, in two columns.
   Steps are full white. */
.reveal .slides > section.layout-exercise {
  justify-content: flex-start;
}

.layout-exercise .exercise {
  flex: none;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: auto auto;
  column-gap: var(--gap-gutter);
  row-gap: var(--head-to-body);
  align-items: start;
  border-top: var(--rule-hang) solid var(--color-on-dark);
  padding-top: var(--gap-group);
}

/* The head spans both rows and both columns and shares the block's grid, so
   its label can sit at the right of the heading row and its timer under the
   title, while the steps take the second column of the second row. */
.layout-exercise .exercise-head {
  grid-column: 1 / -1;
  grid-row: 1 / span 2;
  display: grid;
  grid-template-columns: subgrid;
  grid-template-rows: subgrid;
  gap: normal;
  align-items: start;
}

.layout-exercise .exercise-head > h2 {
  grid-column: 1;
  grid-row: 1;
  text-box-trim: trim-start;
  text-box-edge: cap alphabetic;
}

.layout-exercise .exercise-head > .label {
  grid-column: 2;
  grid-row: 1;
  justify-self: end;
  text-align: right;
  text-box-trim: trim-start;
  text-box-edge: cap alphabetic;
}

.layout-exercise .exercise-head > .timer {
  grid-column: 1;
  grid-row: 2;
}

.layout-exercise .exercise > .list {
  grid-column: 2;
  grid-row: 2;
}

.layout-exercise .timer {
  margin-top: 0;
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: var(--size-display);
  letter-spacing: var(--tracking-display);
  line-height: var(--leading-tight);
  color: var(--color-on-dark);
}

.layout-exercise .list { color: var(--color-on-dark); }

.layout-exercise ol.list > li::before { color: var(--color-accent-on-dark); }

.layout-exercise .list strong { color: var(--color-on-dark); }

/* --------------------------------------------------------------------------
   Bullets
   -------------------------------------------------------------------------- */
.layout-bullets .prose {
  display: flex;
  flex-direction: column;
  gap: var(--gap-group);
  max-width: 52ch;
  font-size: var(--size-lead);
}

/* Build pairs (Ken, Sept 11, 2026): two slides with the same layout, where
   the second only adds words. The first paragraph always holds two lines,
   so the paragraph and signs below it land in the same place on both. */
.layout-bullets .prose.build > p:first-child {
  min-height: calc(2em * var(--leading-body));
}

/* The list is the whole slide, so it takes the lead size, like prose */
.layout-bullets .slide-body > .list {
  gap: var(--gap-group);
  max-width: 60ch;
  font-size: var(--size-lead);
}

/* "Not this" signs, restored from spring's "What's a studio" slide: a word
   under a ring with a slash through it. The ring is the light rule gray, so
   the word stays readable where the slash crosses it. */
.not-this {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-8);
  align-items: center;
}

.no-sign {
  flex: none;
  width: 8rem;
  height: 8rem;
}

.no-sign text {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: var(--size-label);
  letter-spacing: var(--tracking-label);
  fill: var(--color-text-soft);
  text-anchor: middle;
  dominant-baseline: central;
}

.no-sign circle,
.no-sign line {
  fill: none;
  stroke: var(--rule, var(--color-hairline));
}

/* Class 1 deck copy: check lists match the bullet list size on this layout */
.layout-bullets .slide-body > .checks {
  gap: var(--gap-gutter);
  font-size: var(--size-lead);
}

/* --------------------------------------------------------------------------
   Two-column
   -------------------------------------------------------------------------- */
.cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap-gutter);
  align-items: stretch;
}

.layout-two-col.main-aside .cols {
  grid-template-columns: 2fr 1fr;
}

.col {
  display: flex;
  flex-direction: column;
  gap: var(--gap-group);
  min-width: 0;
}

.col-head {
  display: flex;
  align-items: center;
  gap: var(--gap-group);
}

.col .list { max-width: none; }

.layout-two-col.compare .col {
  border: var(--rule-hair) solid var(--color-rule);
  border-radius: var(--radius);
  padding: var(--gap-block);
}

.layout-two-col.compare .col.is-key {
  background: var(--color-panel);
}

/* --------------------------------------------------------------------------
   Big statement and quote
   -------------------------------------------------------------------------- */
.reveal .slides > section.layout-statement {
  justify-content: flex-start;
}

/* Beat slides: the plain statement and the single big number. Same chrome as
   the section opener: a full-width hanging rule, then the first line with the
   label on its cap-height top at the right. The block hangs from the top
   inset, so the rule and first line sit where the slide head sits on content
   slides. The quote keeps its own rules above and below. The callout
   statement's filled block is its own top edge, so it takes no rule. */
.reveal .slides > section.layout-statement:not(.quote):not(.callout-statement),
.reveal .slides > section.layout-stat:not(.tiles) {
  flex-flow: row wrap;
  justify-content: flex-start;
  align-content: flex-start;
  align-items: start;
  column-gap: var(--gap-block);
}

.reveal .slides > section.layout-statement:not(.quote):not(.callout-statement)::before,
.reveal .slides > section.layout-stat:not(.tiles)::before {
  content: "";
  flex: 0 0 100%;
  height: var(--rule-hang);
  margin-bottom: var(--gap-group);
  background: var(--color-text);
}

/* A full-width break after the first line */
.reveal .slides > section.layout-statement:not(.quote):not(.callout-statement)::after,
.reveal .slides > section.layout-stat:not(.tiles)::after {
  content: "";
  order: 3;
  flex: 0 0 100%;
  height: 0;
}

/* Cap-height top alignment, not baseline: the label sits at the top of
   the statement's or stat number's first line whether it wraps or not. */
.layout-statement:not(.quote) .statement,
.layout-stat:not(.tiles) .stat-number {
  order: 1;
  flex: 1 1 0;
  min-width: 0;
  text-box-trim: trim-start;
  text-box-edge: cap alphabetic;
}

.layout-statement:not(.quote) > .label,
.layout-stat:not(.tiles) > .label {
  order: 2;
  margin-left: auto;
  text-align: right;
  text-box-trim: trim-start;
  text-box-edge: cap alphabetic;
}

.layout-statement .support,
.layout-stat:not(.tiles) .stat-label { order: 4; flex: 0 0 100%; }
.layout-stat:not(.tiles) .stat-context { order: 5; flex: 0 0 100%; }
.layout-stat:not(.tiles) > .source { order: 6; flex: 0 0 100%; }

.layout-statement .statement {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-style: var(--style-display);
  font-size: var(--size-display);
  letter-spacing: var(--tracking-display);
  line-height: var(--leading-tight);
  max-width: 26ch;
  text-wrap: balance;
}

/* The statement hangs from the top inset, so an inline accent word's font
   box (taller than the tight line) would poke above the slide's content box.
   As an inline-block its box is its own tight line; the glyphs and the line
   breaks do not move. */
.layout-statement:not(.quote) .statement em {
  display: inline-block;
}

/* Callout variant: the statement sits in a filled dark block across the full
   content width, so it anchors to the same edges as every other slide */
.reveal .slides > section.layout-statement.callout-statement {
  align-items: stretch;
}

.layout-statement.callout-statement .statement {
  flex: none;
  max-width: none;
  border-radius: var(--radius);
  padding: var(--space-6) var(--space-8);
  background: var(--color-dark);
  color: var(--color-on-dark);
}

.layout-statement.callout-statement .statement em { color: var(--color-accent-on-dark); }

.layout-statement .support {
  margin-top: var(--gap-block);
  font-size: var(--size-lead);
  line-height: var(--leading-body);
  color: var(--color-text-soft);
  max-width: 44ch;
  text-wrap: balance;
}

.layout-statement blockquote.quote {
  margin: 0;
  padding: var(--gap-block) 0;
  border-top: var(--rule-heavy) solid var(--color-rule);
  border-bottom: var(--rule-heavy) solid var(--color-rule);
}

.layout-statement blockquote.quote p {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-style: var(--style-display);
  font-size: var(--size-title);
  letter-spacing: var(--tracking-display);
  line-height: var(--leading-tight);
  max-width: 48ch;
  text-wrap: balance;
}

.layout-statement .attribution {
  margin-top: var(--gap-group);
  font-size: var(--size-body);
  color: var(--color-text-soft);
}

.layout-statement .source {
  margin-top: var(--gap-tight);
}

/* --------------------------------------------------------------------------
   Rows: full-width stacked items
   -------------------------------------------------------------------------- */
.rows {
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: row;
}

.rows > li {
  counter-increment: row;
  display: grid;
  grid-template-columns: var(--row-number) var(--row-label) minmax(0, 1fr);
  column-gap: var(--gap-gutter);
  align-items: baseline;
  padding: var(--gap-group) 0;
  border-bottom: var(--rule-hair) solid var(--color-hairline);
}

.rows > li:first-child { padding-top: 0; }

.rows > li:last-child { border-bottom: none; }

.rows > li::before {
  content: counter(row, decimal-leading-zero);
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: var(--size-heading);
  line-height: var(--leading-tight);
  font-variant-numeric: tabular-nums;
  color: var(--color-accent);
}

.rows > li > h3 { min-width: 0; }

.rows > li > p {
  color: var(--color-text-soft);
  min-width: 0;
}

/* Plain rows keep the line column on the same x as numbered rows */
.rows.plain > li {
  grid-template-columns: calc(var(--row-number) + var(--gap-gutter) + var(--row-label)) minmax(0, 1fr);
}

.rows.plain > li::before { content: none; }

/* --------------------------------------------------------------------------
   Table
   -------------------------------------------------------------------------- */
table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--size-body);
  line-height: var(--leading-body);
}

table.data th {
  font-family: var(--font-label);
  font-weight: var(--weight-label);
  font-size: var(--size-label);
  text-transform: var(--case-label);
  letter-spacing: var(--tracking-label);
  line-height: var(--leading-tight);
  color: var(--color-text-faint);
  text-align: left;
  vertical-align: bottom;
  padding: 0 var(--gap-group) var(--gap-tight);
  border-bottom: var(--rule-hang) solid var(--color-rule);
}

/* Naked ruled table: a heavy rule under the header, a hairline under each row */
table.data td {
  text-align: left;
  vertical-align: top;
  padding: var(--space-2) var(--gap-group);
  border-bottom: var(--rule-hair) solid var(--color-hairline);
}

table.data .num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* Naked tables: first and last column text sits on the content edges */
table.data:not(.boxed) :is(th, td):first-child { padding-left: 0; }
table.data:not(.boxed) :is(th, td):last-child { padding-right: 0; }

table.data tr.is-highlight td { background: var(--color-panel); }

table.data tr.is-dim td { color: var(--color-text-faint); }

table.data tr.total td {
  font-weight: var(--weight-strong);
  border-top: var(--rule-hang) solid var(--color-rule);
  border-bottom: none;
}

/* Boxed table, for dense reference tables: hairline box, tinted header row */
table.data.boxed {
  border: var(--rule-hair) solid var(--color-rule);
}

table.data.boxed th {
  background: var(--color-code);
  color: var(--color-text);
  padding: var(--gap-tight) var(--gap-group);
  border-bottom: var(--rule-hair) solid var(--color-rule);
}

table.data.boxed tr:last-child td { border-bottom: none; }

/* --------------------------------------------------------------------------
   Single highlighted panel
   -------------------------------------------------------------------------- */
/* A tinted panel: the tint alone, no border */
.layout-panel .feature {
  display: flex;
  flex-direction: column;
  gap: var(--gap-group);
  border-radius: var(--radius);
  padding: var(--gap-block);
  background: var(--color-panel);
  align-self: flex-start;  /* the panel is as wide as its content */
}

.layout-panel .feature-text {
  font-size: var(--size-lead);
  line-height: var(--leading-body);
  max-width: 52ch;
}

/* --------------------------------------------------------------------------
   Points: a row of 3 to 5, or a grid of 4 to 6 cards
   -------------------------------------------------------------------------- */
.points {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: var(--gap-gutter);
  margin: 0;
  padding: 0;
  list-style: none;
}

.point {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.point > svg.lucide {
  width: var(--icon-heading);
  height: var(--icon-heading);
  stroke-width: 1.75;
  margin-bottom: var(--gap-group);
}

.point > p {
  margin-top: var(--gap-tight);
  color: var(--color-text-soft);
}

.points.grid {
  grid-auto-flow: row;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.points.grid:has(> .point:nth-child(4):last-child) {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.points.grid > .point {
  border: var(--rule-hair) solid var(--color-rule);
  border-radius: var(--radius);
  padding: var(--gap-block);
}

.points.grid > .point > .point-head {
  display: flex;
  align-items: center;
  gap: var(--gap-group);
}

.points.grid > .point.is-key {
  background: var(--color-panel);
}

/* --------------------------------------------------------------------------
   Timeline: horizontal axis, 3 to 5 stops
   -------------------------------------------------------------------------- */
/* The timeline sits centered in the space under the heading, so the axis
   runs across the middle of the slide instead of hugging the title */
.timeline {
  position: relative;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: var(--gap-gutter);
  margin: auto 0;
  padding: 0;
  list-style: none;
  --n: 3;
}

.timeline:has(> .stop:nth-child(4)) { --n: 4; }
.timeline:has(> .stop:nth-child(5)) { --n: 5; }

/* Axis: structure weight, from the first marker to the last marker's center */
.timeline::before {
  content: "";
  position: absolute;
  left: 0;
  right: calc((100% - (var(--n) - 1) * var(--gap-gutter)) / var(--n) - var(--marker) / 2);
  top: calc(var(--marker) / 2 - var(--rule-hair));
  height: calc(var(--rule-hair) * 2);
  background: var(--color-structure);
}

.stop {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.stop::before {
  content: "";
  position: relative;
  width: var(--marker);
  height: var(--marker);
  border-radius: 50%;
  border: calc(var(--rule-hair) * 2) solid var(--color-text);
  background: var(--color-ground);
}

.stop.is-done::before {
  border-color: var(--color-mark);
  background: var(--color-mark);
}

.stop.is-now::before {
  border-color: var(--color-accent);
  background: var(--color-accent);
}

.stop > .label {
  margin-top: var(--gap-group);
}

.stop > h3 {
  margin-top: var(--gap-tight);
}

.stop.is-now > h3 { color: var(--color-accent); }

.stop > p {
  margin-top: var(--gap-tight);
  color: var(--color-text-soft);
  text-wrap: balance;  /* narrow columns: even lines instead of a stranded pair */
}

/* --------------------------------------------------------------------------
   Big number and stat tiles
   -------------------------------------------------------------------------- */
/* The single stat hangs from the top inset (align-content, above). */

.layout-stat .stat-number {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: var(--size-stat);
  letter-spacing: var(--tracking-display);
  line-height: 1;
  color: var(--color-accent);
}

.layout-stat .stat-label {
  margin-top: var(--gap-group);
  max-width: 30ch;
}

.layout-stat .stat-context {
  margin-top: var(--gap-tight);
  max-width: 52ch;
  text-wrap: balance;
  color: var(--color-text-soft);
}

.layout-stat:not(.tiles) .source {
  margin-top: var(--gap-block);
}

.stat-tiles {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: var(--gap-gutter);
  margin: 0;
  padding: 0;
  list-style: none;
}

.tile {
  display: flex;
  flex-direction: column;
  gap: var(--gap-tight);
  border: var(--rule-hair) solid var(--color-rule);
  border-radius: var(--radius);
  padding: var(--gap-block);
  min-width: 0;
}

.tile.is-key { background: var(--color-panel); }

.tile .tile-number {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: var(--size-display);
  letter-spacing: var(--tracking-display);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--color-text);
}

.tile p { color: var(--color-text-soft); }

/* --------------------------------------------------------------------------
   Arrow flow: 3 to 5 boxes, arrows drawn by CSS
   -------------------------------------------------------------------------- */
.flow {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  column-gap: var(--flow-arrow);
  margin: 0;
  padding: 0;
  list-style: none;
}

.flow-step {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--gap-tight);
  min-width: 0;
  border: var(--rule-hair) solid var(--color-text);
  border-radius: var(--radius);
  padding: var(--gap-group);
  background: var(--color-ground);
}

.flow-step > p { color: var(--color-text-soft); }

.flow-step.is-key {
  border-color: var(--color-accent);
  background: var(--color-panel);
}
.flow-step.is-key > h3 { color: var(--color-accent); }

/* Arrow shaft in the gutter before every step after the first */
.flow-step + .flow-step::before {
  content: "";
  position: absolute;
  top: 50%;
  left: calc(var(--flow-arrow) * -1 + var(--space-1));
  width: calc(var(--flow-arrow) - var(--space-1) * 2 - 0.6rem);
  height: calc(var(--rule-hair) * 2);
  margin-top: calc(var(--rule-hair) * -1);
  background: var(--color-structure);
}

/* Arrowhead */
.flow-step + .flow-step::after {
  content: "";
  position: absolute;
  top: 50%;
  left: calc(var(--space-1) * -1 - 0.7rem);
  width: 0.7rem;
  height: 0.9rem;
  margin-top: -0.45rem;
  clip-path: polygon(0 0, 100% 50%, 0 100%);
  background: var(--color-structure);
}

/* Loop variant: a return connector under the boxes, back to the first step */
.flow-return {
  position: relative;
  height: var(--space-8);
  margin-top: 0;
  --n: 3;
}

.flow-wrap:has(.flow > .flow-step:nth-child(4)) .flow-return { --n: 4; }
.flow-wrap:has(.flow > .flow-step:nth-child(5)) .flow-return { --n: 5; }

.flow-return::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: var(--space-2);
  /* center of the first box to center of the last box */
  left: calc((100% - (var(--n) - 1) * var(--flow-arrow)) / var(--n) / 2);
  right: calc((100% - (var(--n) - 1) * var(--flow-arrow)) / var(--n) / 2);
  border: calc(var(--rule-hair) * 2) solid var(--color-structure);
  border-top: none;
}

.flow-return::after {
  content: "";
  position: absolute;
  top: 0;
  left: calc((100% - (var(--n) - 1) * var(--flow-arrow)) / var(--n) / 2 - 0.45rem + var(--rule-hair));
  width: 0.9rem;
  height: 0.7rem;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  background: var(--color-structure);
}

.flow-return > span {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  padding: 0 var(--gap-group);
  line-height: var(--space-4);
  background: var(--color-ground);
  font-family: var(--font-label);
  font-weight: var(--weight-label);
  font-size: var(--size-label);
  text-transform: var(--case-label);
  letter-spacing: var(--tracking-label);
  color: var(--color-structure);
  white-space: nowrap;
}

.flow-wrap {
  display: flex;
  flex-direction: column;
}

/* Two-row variant: up to 8 steps, 4 per row. One picture on one slide.
   Row 2 sits under columns 1 to 3. A connector runs down from the last
   step of row 1, left across the gap, and down into the first step of row 2. */
.layout-flow.flow-two-row .flow {
  position: relative;
  grid-auto-flow: row;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: 1fr;
  row-gap: var(--flow-arrow);
}

/* Connector, part 1: down from the center of step 4, then left to the
   center of step 5. Rows are equal height, so the gap is centered. */
.layout-flow.flow-two-row .flow::before {
  content: "";
  position: absolute;
  top: calc(50% - var(--flow-arrow) / 2);
  height: calc(var(--flow-arrow) / 2);
  left: calc((100% - var(--flow-arrow) * 3) / 8);
  right: calc((100% - var(--flow-arrow) * 3) / 8);
  border: calc(var(--rule-hair) * 2) solid var(--color-structure);
  border-top: none;
  border-left: none;
  box-sizing: border-box;
}

/* Step 5 starts row 2: no side arrow */
.layout-flow.flow-two-row .flow-step:nth-child(5)::before { content: none; }

/* Dense flow: smaller step type, for a slide Ken approves case by case.
   Stays above the room floors: headings 45px, lines 30px at a 30px root. */
.layout-flow.flow-dense .flow-step > h3 { font-size: var(--size-lead); }
.layout-flow.flow-dense .flow-step > p { font-size: var(--size-label); }

.layout-flow.flow-two-row .flow-step:nth-child(5)::after {
  /* shaft and arrowhead down into step 5 */
  top: calc(var(--flow-arrow) / -2 - var(--rule-hair) * 2);
  left: calc(50% - 0.45rem);
  width: 0.9rem;
  height: calc(var(--flow-arrow) / 2 - var(--space-1) + var(--rule-hair) * 2);
  margin-top: 0;
  clip-path: polygon(
    calc(50% + var(--rule-hair)) 0,
    calc(50% + var(--rule-hair)) calc(100% - 0.7rem),
    100% calc(100% - 0.7rem),
    50% 100%,
    0 calc(100% - 0.7rem),
    calc(50% - var(--rule-hair)) calc(100% - 0.7rem),
    calc(50% - var(--rule-hair)) 0
  );
  background: var(--color-structure);
}

/* --------------------------------------------------------------------------
   Image with caption
   -------------------------------------------------------------------------- */
.layout-image figure {
  flex: 1 1 auto;
  min-height: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: var(--gap-group);
}

/* A captioned figure ends on the foot line, so its source line shares the
   slide number's baseline. The caption's measure keeps it clear of the number. */
.layout-image .slide-body > figure:has(> figcaption) {
  margin-bottom: calc(var(--foot-row) * -1);
}

.layout-image figure img {
  display: block;
  flex: 1 1 auto;
  min-height: 0;
  max-width: 100%;
  width: 100%;
  object-fit: contain;
  object-position: left top;
  margin: 0;
}

.layout-image figcaption {
  flex: none;
  max-width: 60ch;
  color: var(--color-text-soft);
  text-wrap: balance;
}

.layout-image figcaption .source {
  display: block;
  margin-top: var(--gap-tight);
}

/* Logo board, restored from spring's client slide: five columns, each group
   of logos under a small filled header box. Every group image is the same
   width, so the logos keep one scale across columns. */
.logo-board {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  column-gap: var(--gap-gutter);
  align-items: start;
}

.logo-col {
  display: flex;
  flex-direction: column;
  gap: var(--gap-tight);
  min-width: 0;
}

.logo-col > img {
  display: block;
  width: 100%;
  height: auto;
}

.logo-col > img + .logo-group {
  margin-top: var(--gap-tight);
}

.logo-group {
  padding: var(--space-1) var(--gap-group);
  border-radius: var(--radius);
  background: var(--rule, var(--color-panel));
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: var(--size-meta);
  line-height: var(--leading-tight);
  text-align: center;
  color: var(--color-text);
}

.layout-image.side .figure-side {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--gap-gutter);
}

.layout-image.side .figure-side > .col { justify-content: flex-start; }

/* --------------------------------------------------------------------------
   Slide number and speaker-view furniture (outside the canvas)
   -------------------------------------------------------------------------- */
.reveal .slide-number {
  font-family: var(--font-body);
  /* Two-thirds of the meta size (Ken, Sept 11, 2026: 27px was distracting).
     His call overrides the 24px meta floor for this one element. The line
     box keeps the source line's height, so the number stays on the foot line. */
  font-size: calc(var(--size-meta) * 2 / 3);
  line-height: calc(var(--size-meta) * var(--leading-body));
  color: var(--color-text-faint);
  background: transparent;
  padding: 0;
  /* On the foot line: the bottom of the content box, where pinned source
     lines end, at the right inset. Same size and leading as .source, so the
     two share a baseline. Positioned in the viewport, so it lands on the
     canvas line when the canvas fills a 16:9 screen (projector, PDF). */
  right: var(--slide-inset-side);
  bottom: var(--slide-inset-bottom);
}

.reveal .slide-number a { color: inherit; }

.reveal[data-ground="band"] .slide-number { color: var(--color-on-band); }
.reveal[data-ground="dark"] .slide-number { color: var(--color-on-dark-soft); }

.reveal .controls { color: var(--color-structure); }

/* ==========================================================================
   Faithful port of spring's class 1 (Sept 11, 2026). Visuals with no
   earlier class. Tokens only.
   ========================================================================== */

/* Nested bullets, as on spring's "Who am I?" slide: hollow markers */
.list .list {
  margin-top: var(--gap-tight);
  gap: var(--gap-tight);
  max-width: none;
}

ul.list ul.list > li::before {
  background: transparent;
  border: calc(var(--rule-hair) * 1.5) solid var(--color-mark);
}

.list.bio {
  gap: var(--gap-group);
  font-size: var(--size-code);
}

/* A plain line that introduces a list, as on spring's Design and Test slides */
.layout-bullets .slide-body > p.intro {
  font-size: var(--size-lead);
  line-height: var(--leading-body);
  margin-bottom: calc(var(--gap-group) - var(--gap-block));
}

/* Two columns of bullets, as on spring's "What We're NOT Focusing On" */
.layout-bullets .slide-body > .cols {
  max-width: 60ch;
}

.layout-bullets .slide-body > .cols .list {
  gap: var(--gap-gutter);
  font-size: var(--size-lead);
}

/* Startup OS diagram: scales down to fit the body, left aligned */
.layout-image figure.diagram > svg.startup-os {
  flex: 1 1 auto;
  min-height: 0;
}

/* The crossed-out A+ sign, restored from spring week two */
.reveal .slides > section.layout-statement.signed .no-sign.big {
  order: 4;
  flex: 0 0 100%;
  height: 11rem;
  margin-top: var(--gap-block);
}

.layout-statement.signed .support { order: 5; }

.no-sign.big text {
  font-size: var(--size-title);
  letter-spacing: 0;
  fill: var(--color-text);
}

.no-sign.big circle,
.no-sign.big line {
  stroke: var(--color-accent);
}

/* Design example collage, restored from spring: photos with black caption tags */
.collage {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: var(--gap-group);
}

.shot {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: var(--rule-hair) solid var(--color-hairline);
}

.shot > img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: left top;
}

.shot > .tag {
  position: absolute;
  left: 0;
  bottom: 0;
  padding: var(--space-1) var(--gap-group);
  background: var(--color-dark);
  color: var(--color-on-dark);
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: var(--size-meta);
  line-height: var(--leading-tight);

}

.c-thumbs   { grid-column: 1; grid-row: 1; }
.c-paper    { grid-column: 1; grid-row: 2 / 4; }
.c-wf-big   { grid-column: 2 / 4; grid-row: 1 / 3; }
.c-cook     { grid-column: 4 / 6; grid-row: 1 / 3; }
.c-wf-small { grid-column: 2; grid-row: 3; }
.c-journey  { grid-column: 3; grid-row: 3; }
.c-manager  { grid-column: 4; grid-row: 3; }
.c-seasoned { grid-column: 5; grid-row: 3; }

  flex: 1 1 auto;
  min-height: 0;

  grid-template-columns: minmax(0, 7fr) minmax(0, 3fr);

  align-items: start;
}

  aspect-ratio: 1600 / 917;
  max-height: 100%;
}

.shot.debug > img { object-fit: contain; }

.shot.debug > .t-cook { top: 1%; bottom: auto; }
.shot.debug > .t-noc { top: 47%; bottom: auto; }

  gap: var(--gap-group);
  font-size: var(--size-meta);
  line-height: var(--leading-body);

/* --------------------------------------------------------------------------
   Real timeline excerpt (Network Operating Center), restored from spring's
   class 1 pages 20 to 22: a vertical axis, row labels to its left, and each
   row's connector running to an icon circle, near or far, with its items.
   Positions are set inline in px on a fixed 1728px-wide canvas. Tokens only.
   -------------------------------------------------------------------------- */
.noc-tl {
  position: relative;
  flex: none;
  width: 100%;
}

.noc-tl > span,
.noc-row > span,
.noc-row > p,
.noc-row > ul {
  position: absolute;
  display: block;
}

.noc-axis {
  width: 10px;
  margin-left: -5px;
  background: var(--color-hairline);
}

  width: 36px;
  height: 36px;
  margin: -18px 0 0 -18px;
  border-radius: 50%;
  border: 7px solid var(--color-text-faint);
  background: var(--color-ground);
}

.noc-end {
  width: 34px;
  height: 34px;
  margin: -17px 0 0 -17px;
  border-radius: 50%;
  border: 6px solid var(--color-hairline);
  background: var(--color-text-soft);
}

.noc-label {
  left: 0;
  margin: 0;
  transform: translateY(-50%);
  text-align: right;
  white-space: nowrap;
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: var(--size-lead);
  line-height: var(--leading-tight);
  color: var(--color-text-soft);
}

.noc-line {
  height: 5px;
  margin-top: -2.5px;
  background: var(--color-text-faint);
}

.noc-vline {
  width: 5px;
  margin-left: -2.5px;
  background: var(--color-text-faint);
}

.noc-dot {
  width: 26px;
  height: 26px;
  margin: -13px 0 0 -13px;
  border-radius: 50%;
  background: var(--color-text-faint);
}

.noc-tip {
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  border-radius: 50%;
  background: var(--color-text-faint);
}

.noc-icon {
  width: 100px;
  height: 100px;
  margin: -50px 0 0 -50px;
  border-radius: 50%;
  background: var(--color-text-soft);
  display: flex !important;
  align-items: center;
  justify-content: center;
}

.reveal .noc-icon svg.lucide {
  width: 52px;
  height: 52px;
  stroke-width: 1.5;
  color: var(--color-ground);
}

.noc-items {
  margin: 0;
  padding: 0;
  list-style: none;
  transform: translateY(-50%);
  white-space: nowrap;
  font-size: var(--size-code);
  line-height: 1.15;
  color: var(--color-text);
}

/* Long items stay on one line: the deck's li text-wrap would otherwise break them */
.reveal .noc-items > li {
  white-space: nowrap;
  text-wrap: nowrap;
}

/* The six-item list under the elbow hangs from its icon's top, as in spring */
.noc-items.is-hanging { transform: none; }

.noc-row.is-deploy .noc-label { color: var(--color-mark); }

.noc-row.is-deploy :is(.noc-line, .noc-dot, .noc-tip),
.noc-row.is-deploy .noc-icon {
  background: var(--color-mark);
}

/* The continuation pages carry no slide head, like spring's */
.layout-image.noc .slide-body { gap: 0; }

/* Fit fixes for the port: the client slide carries spring's subhead, and the
   cost table gained a books row (Ken, Sept 11, 2026). */
.layout-image .slide-head:has(> .lede) + .slide-body > .logo-board { width: 93%; }
table.data.compact td { padding-block: calc(var(--space-2) - var(--space-1) / 2); }

/* Bold words in body text (Ken, Sept 11, 2026: "not bold enough"). Hanken
   Grotesk is bundled as a variable font from 100 to 900, so 900 is a real
   weight, not a faked bold. Was --weight-strong (600). Purple on light
   grounds, white on dark and band grounds. Headings, table headers, and
   placeholders keep their own styling. */
.reveal .slides strong,
.reveal .slides b {
  font-weight: 900;
  color: var(--color-accent);
}
.reveal .slides > section:is(.layout-exercise, .layout-section) :is(strong, b),
.reveal .slides .callout :is(strong, b) { color: var(--color-on-dark); }
.reveal .slides :is(h1, h2, h3, th, .ken) :is(strong, b) { font-weight: inherit; color: inherit; }

/* Semester mapped onto Startup OS phases (Ken, Sept 11, 2026): a two-slide
   build. The first slide keeps the later weeks' lines in place but hidden,
   so nothing moves when the second slide adds them. */
.layout-timeline.os-arc-a .later { visibility: hidden; }

/* Sign words sit above the slash with a knockout stroke in the ground color,
   so LECTURE, SEMINAR, and A+ read whole (Ken, Sept 11, 2026) */
.no-sign text {
  paint-order: stroke;
  stroke: var(--color-ground);
  stroke-width: 10px;
  stroke-linejoin: round;
}

/* Callout sign slide (Ken, Sept 11, 2026): spring's crossed-out A+ as the
   centered visual, then the statement, then the support line. No title bar,
   rule, or label. The group centers on the beat slides' optical line. */
.reveal .slides > section.layout-sign {
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: var(--gap-block);
  padding-bottom: calc(var(--slide-inset-top) + var(--beat-lift));
}

.layout-sign .no-sign.big {
  flex: none;
  width: 13rem;
  height: 13rem;
}

.layout-sign .statement {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: var(--size-display);
  letter-spacing: var(--tracking-display);
  line-height: var(--leading-tight);
  max-width: 26ch;
  text-wrap: balance;
}

.layout-sign .support {
  font-size: var(--size-lead);
  line-height: var(--leading-body);
  color: var(--color-text-soft);
  max-width: 44ch;
  text-wrap: balance;
}

  <style>/* themes/stclair.css */
/* Default theme: white ground, ink text, purple accent, cobalt structure,
   sage marks. Faces: Schibsted Grotesk and Hanken Grotesk.

   Round 2. The shared tokens come from system-tokens.css, a vendored copy of
   ~/Documents/workspace/personal/lib/templates/system-tokens.css (the source
   of truth for web, documents, and presentations). Never edit the copy.
   This file maps the deck's contract roles onto those shared tokens and adds
   only slide-specific values: the 1920x1080 type scale, rule weights at slide
   scale, and colors the shared file does not have yet (each marked below).

   Round 1 is kept as stclair-r1.css for comparison.
   Course decks carry no business name or logo, so this theme defines none.
   A theme file is an optional @import, font loading, and one :root block.
   No selectors. Contract: COMPONENTS.md, "Theme contract". */

/*
  System tokens, Ken St. Clair
  SOURCE OF TRUTH for every surface: web, documents, presentations.

  Each surface imports this file and adds only its own rules. Do not redefine a
  token below in a surface stylesheet. If a surface needs a value this file does
  not have, add it here so the other surfaces can see it.

  Token names are stable. Renaming one breaks every surface that imports it, and
  at least one surface vendors a copy rather than importing across repos (the
  Columbia deck system). If you rename or add a token, say so in the commit and
  tell the deck maintainer.

  What belongs here, and what does not:
    Here      any colour, type or spacing role more than one surface uses.
    Not here  values only one surface can use. Slide-only type scales, slide
              margins, page-print margins and the like stay in that surface's
              own file under surface-specific names. If such a value turns out
              to be a shared role, move it here rather than copying it.

  Agreed with the deck surface on 2026-09-11: the vendored copy is taken whole
  including this header, nobody edits it locally, and any new shared role comes
  back here as a request rather than being defined in the copy.

  Consumers:
    lib/templates/document.css                      documents, briefs, one-pagers
    projects/agent_storefront/site/index.html        the web surface (inline today)
    columbia .../templates/deck-system/themes/       presentations (vendored copy)
*/

:root{
  /* ---------- colour ---------- */

  /* Structural neutrals. Every surface uses these. */
  --white:#ffffff;
  --paper:#f7f7f5;
  --ink:#1f1e1a;
  --ink-soft:#55534b;
  --ink-faint:#6b6860;
  --rule:#dcdad6;
  --rule-ondark:#4a4842;

  /* Accents. One jab of colour per element, never a gradient. */
  --purple:#46188c;
  --purple-hover:#35126b;
  /* Derived to match the other two tints rather than picked by eye: hue held,
     lightness 95%. Ink reads 14.30:1 on it, against 14.39 on cobalt-tint and
     14.46 on sage-tint, so the three are interchangeable for contrast. */
  --purple-tint:#f1ebfa;
  --link:#6d28d9;
  --cobalt:#0760c7;
  --cobalt-hover:#054a99;
  --cobalt-tint:#e6effc;
  /*
    Two sages, and they are one colour with two legibility variants rather than
    two colours. #8fb5a0 is the brand sage: it is what STYLE_GUIDE.md lists and
    what the logo's middle segment uses, on white and on ink. It is unreadable
    as a mark on white, at 2.26:1, so marks on white use a darkened version.

                      on ink      on white
      --sage-fill     7.38:1      2.26:1
      --sage          3.57:1      4.67:1

    Each fails where the other passes, so pick by ground, not by taste.
  */
  --sage-fill:#8fb5a0;   /* brand sage: fills, illustrations, the logo segment, anything on ink */
  --sage:#637a63;        /* darkened: bullet dots and marks on white */
  --sage-tint:#e7f1ed;

  /* Deprecated alias, kept because the deck surface vendors this file and a
     rename would break it. Was #84c1ae, now resolves to the brand sage, which
     clears the floor on ink at 7.38:1 and matches the logo. Use --sage-fill. */
  --sage-lift:var(--sage-fill);

  /* ---------- text on an ink ground ---------- */
  /* Body text on dark is full white, 16.68:1. This is a house decision, not a
     contrast one: a softened grey for body copy on a dark band was rejected.
     The two values below are for secondary and meta text only.
     Large-format surfaces such as slides may use soft for secondary copy where
     full white at size glares. */
  --ink-soft-ondark:#d9d7d1;   /* 11.59:1, secondary copy at large sizes */
  --ink-faint-ondark:#b3b0a8;  /* 7.70:1, meta, section numbers, captions */

  /* ---------- type ---------- */

  --font-display:"Schibsted Grotesk","Hanken Grotesk",system-ui,sans-serif;
  --font-body:"Hanken Grotesk",system-ui,sans-serif;

  /* Weights. The wordmark stays at 600 wherever it appears. */
  --w-body:400;
  --w-medium:500;
  --w-display:600;
  --w-bold:700;

  /* ---------- spacing, 4px-rooted ---------- */

  --s1:4px; --s2:8px; --s3:12px; --s4:18px;
  --s5:28px; --s6:44px; --s7:72px; --s8:104px;

  /* ---------- lines and radius ---------- */

  --r:4px;
  --r-lg:6px;
  --line:1px solid var(--rule);
  --line-ink:1px solid var(--ink);
  --divider:2px solid var(--ink);

  /* ---------- layout ---------- */

  --maxw:1080px;
  --read:68ch;
}

:root {
  /* Color roles, mapped to shared tokens */
  --color-ground: var(--white);
  --color-text: var(--ink);
  --color-text-soft: var(--ink-soft);
  --color-text-faint: var(--ink-faint);
  --color-rule: var(--ink);
  /* Class 1 deck copy: --rule (#dcdad6, 1.4:1) washes out on a projector.
     The faint on-dark ink is 2.17:1 on white and still lighter than the header rule. */
  --color-hairline: var(--ink-faint-ondark);
  --color-accent: var(--purple);
  --color-structure: var(--cobalt);
  --color-mark: var(--sage);
  --color-panel: var(--sage-tint);
  --color-code: var(--cobalt-tint);
  --color-band: var(--cobalt);
  --color-on-band: var(--white);
  --color-dark: var(--ink);
  --color-on-dark: var(--white);

  /* Fills and sage on dark grounds: the brand sage, --sage-fill (7.38:1 on
     ink). Marks on white stay --sage above. Meta text on dark: the faint
     on-dark ink. All come from system-tokens.css, no local hex values. */
  --color-fill: var(--sage-fill);
  --color-accent-on-dark: var(--sage-fill);
  --color-on-dark-soft: var(--ink-faint-ondark);

  /* Faces. --font-display and --font-body come from system-tokens.css. */
  --font-label: var(--font-display);
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --weight-display: var(--w-display);
  --weight-body: var(--w-body);
  --weight-strong: var(--w-display);
  --weight-label: var(--w-display);
  --style-display: normal;
  --style-accent: normal;
  --case-label: none;
  --tracking-label: 0;

  /* Type scale, slide only. --type-root is the one lever: every size here and
     every space in layouts.css is in rem, so this value scales the letters and
     the composition together. Round 3: sized for the back row of a 50-person
     room. Floors are in COMPONENTS.md, "Room floors". */
  --type-root: 30px;
  --size-stat: 9rem;
  --size-display: 4.4rem;
  --size-title: 2.8rem;
  --size-heading: 1.6rem;
  --size-lead: 1.5rem;
  --size-body: 1.3rem;
  --size-label: 1rem;
  --size-code: 1.1rem;
  --size-meta: 0.9rem;
  --leading-tight: 1.08;
  --leading-body: 1.4;
  --tracking-display: -0.012em;

  /* Surfaces. Rule weights are slide scale; the radius is shared. */
  --rule-hair: 2px;
  --rule-hang: 4px;   /* the document's 2px --divider, doubled for 70px slide titles */
  --rule-heavy: 8px;
  --radius: var(--r);
}

Picked from Ken's personal-email newsletters, Oct 9 to 16 (mostly The AI Collective, Oct 12 and Oct 14). Each card links a page I fetched Oct 16. No one's words are in quotation marks on the slide. NOW IT'S CLAUDE (Ken, Oct 16: the police tip is a good one to discuss, so lead with it): during a test, a Claude model was asked to write example content, and it submitted an invented tip to a real police department's form. Anthropic says the tip was flagged as spam and never forwarded. Philadelphia police disclosed it themselves in a press release. Discuss: no one told the agent to contact the police. It was asked for sample text and it found a real form. Who is responsible: the model maker, the team running the test, or the site with the open form? If your product's agent fills in a form on someone else's site, what stops it from sending something false? Background: last week was OpenAI's agents loose on Wikipedia and Hugging Face. On Oct 9 Anthropic published its own list. During internal tests, Claude models (Mythos 5, Haiku 4.5, Opus 5, and others) read access tokens from a site's settings file to query a county property map, asked for a dashboard token to skip a state agency's fee, used an injection flaw on a university server, submitted a government form on a real website, and submitted an invented tip to a police department's form. Anthropic says the tip was flagged as spam and never forwarded. The Philadelphia Police Department disclosed it in a press release. Anthropic briefed the White House, notified each agency, and cut live internet access from all its internal evaluations until its monitoring can catch this. It says impact was minimal and no customer data was involved. Press called it a false homicide tip and reported Philadelphia police criticized a two-month detection gap (TechCrunch, via the newsletter; I did not check that). The next day Satya Nadella posted on X that companies should assume a model is compromised and keep a human who can pause it mid-task (via TechCrunch; I did not open his post). Ask: if you ship an agent, what is it allowed to touch? Who can stop it? AI ON YOUR TV (Ken, Oct 16: swapped in for the Facebook story; found by web search, not in the newsletters): on Oct 12 Anthropic's red team (William Zhou and Daniel Freeman) published a test of AI copying itself onto internet-connected devices. They ran an open model (Gemma4-26B-A4B) split across 15 off-brand Android TV boxes, about $55 each, at 0.39 tokens per second, which is very slow. In a walled-off test network of 8 emulated Android devices, one open model (GLM-5.2) copied itself to all 8 in 4 of 5 trials, and to 7 in the fifth. The devices' debug ports needed no password. Their claim: if small models keep improving at past rates, they could do this on real devices by the end of this year. Their caveats: they have not built a full rogue copy, the hacking step was made easy on purpose, the timing rests on a rough proxy measure, and each copy would take a day or two. Ask: who is responsible for a $55 box with an open port? If you ship hardware, lock it down. JEV AT $7.5B: TypeSafe, maker of Jev, raised $870 million at a $7.5 billion valuation, led by Andreessen Horowitz with Sequoia and DCVC. Jev launched Sep 15. The company claims a third of the Fortune 500 already use it (its claim, per TechCrunch). Ask (Ken, Oct 16: tie it to moats, which we talked about before): what is Jev's moat? Last week we asked the same of the Adobe clone. Use Lenny Rachitsky and Dan Hockenmaier's test (Lenny's Newsletter, Oct 13): only four advantages compound, which are switching costs, network effects, scale, and data. Speed, distribution, brand, and funding are fuel, not moats. Which of the four could TypeSafe build? Data is the likely answer: every customer decision Jev scores could make the next one better. Then turn it on them: which of the four could your startup build? Runner-ups in news_research.md: Facebook's Your algorithm (Oct 13), Lenny's four real moats, Gemini 4 Argon's price doubling Dec 1, and whether AI ends the lecture in ten years.

  <ol class="rows">

<!-- statement: case study, the real conversion rate | src: fall-only (Ken, Oct 16: what's the actual conversion rate) -->
<!-- .slide: class="layout-statement" -->
<p class="label">Case study</p>
<p class="statement">That overnight success is <em>0.3%</em> of her Instagram followers.</p>
<p class="support">Count TikTok too and it's 0.05%. At 0.3%, 100 sign-ups takes about 33,000 followers.</p>

Notes:
Python: 1,000 sign-ups divided by 336,000 Instagram followers is 0.30%. Divided by Instagram plus TikTok, 2,036,000 followers, it's 0.049%. At 0.3%, 100 sign-ups needs about 33,000 followers (python: 100 divided by 0.003 is 33,333). These are floor numbers: she said over 1,000, and not every follower saw the post. The lesson is not that she has a big audience. It's that even a big, warm, well-matched audience converts at a fraction of a percent. Your teams don't have 336K followers. That's why you borrow audiences, post every day as a founder, and send each channel to its own landing page. Ask: whose audience already trusts them and looks like your customer?

  <script>/* js/deck.js */
/* Deck behavior: reveal config, icons, ground sync, exercise countdown.
   No styling lives here. */

Reveal.initialize({
  hash: true,
  slideNumber: "c/t",
  controls: false,  // web chrome; keyboard and clicker still work
  progress: false,
  center: false,
  transition: "none",

  // Fixed 1920x1080 canvas. Reveal scales it to the window.
  width: 1920,
  height: 1080,
  margin: 0,
  minScale: 0.2,
  maxScale: 2.0,

  // Slides are flex columns so regions can push to the bottom.
  display: "flex",

  plugins: [RevealMarkdown, RevealNotes, RevealZoom],
});

// Tell layouts.css which kind of ground is showing, so the slide number
// and the letterbox around the canvas match the slide.
function syncGround(slide) {
  if (!slide) return;
  var ground = "ground";
  if (slide.classList.contains("layout-section")) ground = "band";
  if (slide.classList.contains("layout-exercise")) ground = "dark";
  var reveal = document.querySelector(".reveal");
  reveal.setAttribute("data-ground", ground);
  document.body.style.backgroundColor = getComputedStyle(slide).backgroundColor;
}

// Exercise countdown. <p class="timer" data-countdown="15">Until 2:05</p>
// shows the static text in the PDF and counts down from 15:00 when the slide
// is on screen.
var timers = new Map();

function startTimers(slide) {
  if (!slide) return;
  slide.querySelectorAll(".timer[data-countdown]").forEach(function (el) {
    var minutes = parseFloat(el.getAttribute("data-countdown"));
    if (!minutes) return;
    if (!el.hasAttribute("data-static")) el.setAttribute("data-static", el.textContent);
    // data-until (epoch ms) pins the end time, so a reload keeps the clock.
    var until = parseFloat(el.getAttribute("data-until"));
    var end = until ? until : Date.now() + minutes * 60000;
    function tick() {
      var left = Math.max(0, Math.round((end - Date.now()) / 1000));
      var m = Math.floor(left / 60);
      var s = String(left % 60).padStart(2, "0");
      el.textContent = left > 0 ? m + ":" + s : "Time";
    }
    tick();
    timers.set(el, setInterval(tick, 1000));
  });
}

function stopTimers(slide) {
  if (!slide) return;
  slide.querySelectorAll(".timer[data-countdown]").forEach(function (el) {
    clearInterval(timers.get(el));
    timers.delete(el);
    if (el.hasAttribute("data-static")) el.textContent = el.getAttribute("data-static");
  });
}

Reveal.on("ready", function (event) {
  lucide.createIcons();
  syncGround(event.currentSlide);
  startTimers(event.currentSlide);
  document.fonts.ready.then(function () {
    document.documentElement.setAttribute("data-deck-ready", "1");
  });
});

Reveal.on("slidechanged", function (event) {
  stopTimers(event.previousSlide);
  syncGround(event.currentSlide);
  startTimers(event.currentSlide);
});
</script>
